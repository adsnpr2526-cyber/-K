<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณค่า K และออกรายงานแนบท้ายสัญญา</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; padding: 20px; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); margin-bottom: 20px; }
        .card-header { font-weight: bold; }
    </style>
</head>
<body>

<div class="container-fluid">
    <h3 class="mb-4">📊 ระบบคำนวณค่า K และออกรายงานแนบท้ายสัญญา</h3>

    <!-- Section 3: รายการงวดงานก่อสร้าง -->
    <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <span>📝 3. รายการงวดงานก่อสร้าง</span>
            <button class="btn btn-light btn-sm" onclick="addRow()">➕ เพิ่มรายการงวดงาน</button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered align-middle" id="workTable">
                    <thead class="table-light">
                        <tr class="text-center">
                            <th style="width: 5%;">งวดที่</th>
                            <th style="width: 15%;">วันที่ส่งมอบ</th>
                            <th style="width: 18%;">ค่างานทั้งหมด (บาท)</th>
                            <th style="width: 18%;">ไม่อยู่ในข่าย (บาท)</th>
                            <th style="width: 25%;">สูตรค่า K</th>
                            <th style="width: 10%;">ดัชนีประจำงวด</th>
                            <th style="width: 9%;">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="workTableBody">
                        <tr>
                            <td class="text-center">1</td>
                            <td><input type="text" class="form-control" value="30 มิ.ย. 2559"></td>
                            <td><input type="number" class="form-control" value="1400000"></td>
                            <td><input type="number" class="form-control" value="250000"></td>
                            <td>
                                <select class="form-select k-formula-select">
                                    <optgroup label="หมวดงานอาคาร">
                                        <option value="K1" selected>K1 - งานอาคาร</option>
                                    </optgroup>
                                    <optgroup label="หมวดงานดิน">
                                        <option value="K2">K2 - งานดิน</option>
                                        <option value="K3">K3 - งานระเบิดหิน</option>
                                    </optgroup>
                                    <optgroup label="หมวดงานทาง">
                                        <option value="K4">K4 - งานผิวทาง Prime/Tack Coat</option>
                                        <option value="K5">K5 - งานผิวทาง Surface Treatment</option>
                                        <option value="K6">K6 - งานผิวทาง Asphaltic Concrete</option>
                                        <option value="K7">K7 - งานผิวทาง ค.ส.ล.</option>
                                        <option value="K8">K8 - งานสะพานและท่อเหลี่ยม</option>
                                    </optgroup>
                                    <optgroup label="หมวดงานชลประทาน">
                                        <option value="K9">K9 - งานคลองส่งน้ำคอนกรีต / เขื่อนคอนกรีต</option>
                                        <option value="K10">K10 - งานอาคารชลประทานอื่นๆ</option>
                                    </optgroup>
                                    <optgroup label="หมวดงานระบบท่อ">
                                        <option value="K11">K11 - งานวางท่อเหล็กเหนียว / HDPE</option>
                                        <option value="K12">K12 - งานวางท่อ ค.ส.ล. / PVC</option>
                                    </optgroup>
                                </select>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-info btn-sm text-white">⚙️ ตั้งค่าดัชนีงวด</button>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-danger btn-sm" onclick="deleteRow(this)">🗑️ ลบ</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="mt-3">
                <button class="btn btn-success" onclick="calculateAll()">🚀 คำนวณทั้งหมด และประมวลผลรายงาน</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ตัวเลือกสูตร K ทั้งหมดสำหรับสร้างแถวใหม่
    const kOptionsHTML = `
        <optgroup label="หมวดงานอาคาร">
            <option value="K1">K1 - งานอาคาร</option>
        </optgroup>
        <optgroup label="หมวดงานดิน">
            <option value="K2">K2 - งานดิน</option>
            <option value="K3">K3 - งานระเบิดหิน</option>
        </optgroup>
        <optgroup label="หมวดงานทาง">
            <option value="K4">K4 - งานผิวทาง Prime/Tack Coat</option>
            <option value="K5">K5 - งานผิวทาง Surface Treatment</option>
            <option value="K6">K6 - งานผิวทาง Asphaltic Concrete</option>
            <option value="K7">K7 - งานผิวทาง ค.ส.ล.</option>
            <option value="K8">K8 - งานสะพานและท่อเหลี่ยม</option>
        </optgroup>
        <optgroup label="หมวดงานชลประทาน">
            <option value="K9">K9 - งานคลองส่งน้ำคอนกรีต / เขื่อนคอนกรีต</option>
            <option value="K10">K10 - งานอาคารชลประทานอื่นๆ</option>
        </optgroup>
        <optgroup label="หมวดงานระบบท่อ">
            <option value="K11">K11 - งานวางท่อเหล็กเหนียว / HDPE</option>
            <option value="K12">K12 - งานวางท่อ ค.ส.ล. / PVC</option>
        </optgroup>
    `;

    function addRow() {
        const tbody = document.getElementById('workTableBody');
        const rowCount = tbody.rows.length + 1;
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
            <td class="text-center">${rowCount}</td>
            <td><input type="text" class="form-control" placeholder="ระบุวันที่"></td>
            <td><input type="number" class="form-control" value="0"></td>
            <td><input type="number" class="form-control" value="0"></td>
            <td>
                <select class="form-select k-formula-select">
                    ${kOptionsHTML}
                </select>
            </td>
            <td class="text-center">
                <button class="btn btn-info btn-sm text-white">⚙️ ตั้งค่าดัชนีงวด</button>
            </td>
            <td class="text-center">
                <button class="btn btn-danger btn-sm" onclick="deleteRow(this)">🗑️ ลบ</button>
            </td>
        `;
        tbody.appendChild(tr);
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        row.remove();
        updateRowNumbers();
    }

    function updateRowNumbers() {
        const rows = document.querySelectorAll('#workTableBody tr');
        rows.forEach((row, index) => {
            row.cells[0].innerText = index + 1;
        });
    }

    function calculateAll() {
        alert('ระบบประมวลผลคำนวณเรียบร้อยแล้ว');
    }
</script>

</body>
</html>
